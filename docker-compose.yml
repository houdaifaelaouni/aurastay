# Runs AuraStay locally: MongoDB, the API on :8000 and the web app on :3000.
#   docker compose up --build
# Then open http://localhost:3000 (check-in kit: http://localhost:3000/pass/).
# Override any value with a .env file next to this one.

services:
  mongodb:
    image: mongo:7
    volumes:
      - mongodb_data:/data/db
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
    ports:
      - "8000:8000"
    environment:
      - MONGO_URL=${MONGO_URL:-mongodb://mongodb:27017}
      - DB_NAME=${DB_NAME:-aurastay}
      - JWT_SECRET=${JWT_SECRET:-local-dev-secret-change-me}
      - CORS_ORIGINS=${CORS_ORIGINS:-http://localhost:3000}
      - PUBLIC_APP_URL=${PUBLIC_APP_URL:-http://localhost:3000}
      - CHECKIN_SECRET=${CHECKIN_SECRET:-local-checkin-secret}
      - BOOTSTRAP_EMAIL=${BOOTSTRAP_EMAIL:-owner@aurastay.com}
      - BOOTSTRAP_PASSWORD=${BOOTSTRAP_PASSWORD:-owner1234}
      - MANAGER_EMAIL=${MANAGER_EMAIL:-manager@aurastay.com}
      - MANAGER_PASSWORD=${MANAGER_PASSWORD:-manager1234}
    depends_on:
      mongodb:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      # Repo root, so the build can include checkin-kit at /pass.
      context: .
      dockerfile: frontend/Dockerfile
      args:
        # Baked in at build time; the browser calls the API directly.
        - REACT_APP_BACKEND_URL=${REACT_APP_BACKEND_URL:-http://localhost:8000}
    ports:
      - "3000:3000"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  mongodb_data:
